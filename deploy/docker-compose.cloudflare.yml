# docker-compose.cloudflare.yml – Zero-Trust-Zugang ohne VPN-Client
# ================================================================
# Veröffentlicht die ERP-App über einen Cloudflare-Tunnel, ohne dass
# am Router/Firewall ein Port geöffnet werden muss. Das zugreifende
# Endgerät braucht NUR einen Browser – keine VPN-Software.
#
# Starten (zusätzlich zur Haupt-Compose-Datei):
#   docker compose -f docker-compose.yml -f docker-compose.cloudflare.yml up -d
#
# Voraussetzung: CF_TUNNEL_TOKEN in der .env setzen
#   (aus Cloudflare Zero Trust → Networks → Tunnels → <dein Tunnel>)
# ================================================================

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ${APP_NAME:-baukalkulation-es-app}-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN:?CF_TUNNEL_TOKEN fehlt – siehe Cloudflare Zero Trust Dashboard}
    # Kein 'ports:' nötig – der Tunnel baut eine AUSGEHENDE Verbindung auf.
    depends_on:
      - app
