site_name: Baukalkulation ES
site_description: Installation, Betrieb und Entwicklung
docs_dir: docs
strict: true

theme:
  name: material
  language: de
  features:
    - navigation.sections
    - content.code.copy

nav:
  - Start: index.md
  - Installation: installation.md
  - Entwicklung: entwicklung.md
  - KI-Architektur: ki-architektur.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
