# git-cliff: Release-Notes aus Conventional Commits (feat:, fix:, …).
# Das ausführliche CHANGELOG.md wird weiterhin von Hand gepflegt.
[changelog]
header = ""
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} – {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unveröffentlicht
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}\
{% if commit.breaking %} (**BREAKING**){% endif %}
{% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+$"
sort_commits = "oldest"
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->Neu" },
    { message = "^fix", group = "<!-- 1 -->Behoben" },
    { message = "^sec", group = "<!-- 2 -->Sicherheit" },
    { message = "^perf", group = "<!-- 3 -->Performance" },
    { message = "^refactor", group = "<!-- 4 -->Umbau" },
    { message = "^doc", group = "<!-- 5 -->Dokumentation" },
    { message = "^test", group = "<!-- 6 -->Tests" },
    { message = "^(build|ci)", group = "<!-- 7 -->Build/CI" },
    { message = "^chore\\(deps\\)", skip = true },
    { message = "^chore", group = "<!-- 8 -->Sonstiges" },
]
