name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, mbstring, fileinfo, gd, zip, curl, sodium
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit

  tests-pgsql:
    name: Tests (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ['15', '17']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: bk
          POSTGRES_PASSWORD: bk-ci-pw
          POSTGRES_DB: bk_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bk -d bk_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BK_DB_DRIVER: pgsql
      BK_DB_HOST: 127.0.0.1
      BK_DB_PORT: '5432'
      BK_DB_NAME: bk_test
      BK_DB_USER: bk
      BK_DB_PASSWORD: bk-ci-pw
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, pdo_pgsql, mbstring, fileinfo, gd, zip, curl, sodium
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit

  static:
    name: Statische Analyse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring, fileinfo, gd, zip
          coverage: none
      - run: composer install --no-interaction --no-progress
      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=2G --no-progress
      - name: PHP-CS-Fixer
        run: vendor/bin/php-cs-fixer check --diff

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Versionskonsistenz (VERSION, manifest.json, ?v=)
        run: node scripts/check-versions.mjs --strict
      - name: script.min.js aktuell?
        run: |
          npm run minify
          git diff --exit-code -- public/script.min.js || {
            echo "::error::public/script.min.js passt nicht zu public/script.js – 'npm run minify' ausführen und committen."
            exit 1
          }
      - run: npm run build

  security:
    name: Sicherheit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks (Secrets im Repo)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Composer audit
        run: composer audit --locked --no-dev
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: npm audit
        run: npm audit --omit=dev --audit-level=high
      - name: Semgrep (SAST)
        if: github.actor != 'renovate[bot]'
        run: |
          pipx run semgrep scan --config p/php --config p/javascript --config p/secrets \
            --error --metrics=off --exclude public/lib --exclude public/script.min.js

  docs:
    name: Dokumentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install mkdocs-material
      - run: mkdocs build --strict

  docker:
    name: Docker-Build
    runs-on: ubuntu-latest
    needs: [tests, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.app
          push: false
          build-args: ENABLE_OCR=false
          cache-from: type=gha
          cache-to: type=gha,mode=max
